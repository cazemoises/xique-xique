name: Deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run frontend tests
        run: |
          docker run --rm -v $PWD:/app -w /app node:22-alpine sh -c "npm ci && npm run test -- --run"
      - name: Build and deploy
        run: |
          docker compose up -d --build
          docker system prune -f